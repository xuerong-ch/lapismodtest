name: Build 7-Zip Modern Context Menu
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand source
        shell: pwsh
        run: Expand-Archive -Path SevenZipModernContext-source.zip -DestinationPath work -Force
      - name: Repair diagnostic source transfer
        shell: pwsh
        run: |
          $p = 'work/SevenZipModernContext/src/ExplorerCommand.cpp'
          $lines = Get-Content $p
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -like '*guidCommandName*CLSID_ExtractHere*') {
              $lines[$i] = '        *guidCommandName = CLSID_ExtractHere;'
            }
          }
          Set-Content -Path $p -Value $lines -Encoding utf8

      - name: Configure x64
        working-directory: work/SevenZipModernContext
        run: cmake -S . -B build -A x64
      - name: Build Release
        working-directory: work/SevenZipModernContext
        run: cmake --build build --config Release --parallel
      - name: Stage sparse external location
        working-directory: work/SevenZipModernContext
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/external/Assets | Out-Null
          Copy-Item build/Release/SevenZipModernContext.dll dist/external/
          Copy-Item build/Release/SevenZipModernContextHost.exe dist/external/
          Copy-Item Assets/* dist/external/Assets/
          Copy-Item scripts/install.ps1 dist/
          Copy-Item scripts/uninstall.ps1 dist/
      - name: Locate Windows SDK tools
        id: sdk
        working-directory: work/SevenZipModernContext
        shell: pwsh
        run: |
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $makeappx = Get-ChildItem $kits -Filter makeappx.exe -Recurse | Where-Object FullName -Match '\\x64\\makeappx.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
          $signtool = Get-ChildItem $kits -Filter signtool.exe -Recurse | Where-Object FullName -Match '\\x64\\signtool.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx -or -not $signtool) { throw 'Windows SDK packaging tools not found.' }
          "makeappx=$($makeappx.FullName)" >> $env:GITHUB_OUTPUT
          "signtool=$($signtool.FullName)" >> $env:GITHUB_OUTPUT
      - name: Build sparse identity MSIX
        working-directory: work/SevenZipModernContext
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path identity-stage | Out-Null
          Copy-Item package/AppxManifest.xml identity-stage/AppxManifest.xml
          & '${{ steps.sdk.outputs.makeappx }}' pack /d identity-stage /p dist/SevenZipModernContext.identity.msix /nv /o
      - name: Generate development signing certificate
        working-directory: work/SevenZipModernContext
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=SevenZipModernContext' -FriendlyName 'SevenZipModernContext GitHub Actions Development' -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -KeyUsage DigitalSignature -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3')
          $password = ConvertTo-SecureString -String 'temporary-ci-password' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath signing.pfx -Password $password | Out-Null
          Export-Certificate -Cert $cert -FilePath dist/SevenZipModernContext.cer | Out-Null
      - name: Sign identity MSIX
        working-directory: work/SevenZipModernContext
        shell: pwsh
        run: |
          & '${{ steps.sdk.outputs.signtool }}' sign /fd SHA256 /f signing.pfx /p temporary-ci-password dist/SevenZipModernContext.identity.msix
          if ($LASTEXITCODE -ne 0) { throw 'signtool sign failed.' }
      - name: Package release zip
        working-directory: work/SevenZipModernContext
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath SevenZipModernContext-x64.zip -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SevenZipModernContext-x64
          path: work/SevenZipModernContext/SevenZipModernContext-x64.zip
          if-no-files-found: error
